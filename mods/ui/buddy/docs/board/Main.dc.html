<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terminal animations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet" />
<style>
body{margin:0}
a{color:#d97757}a:hover{color:#f0a080}
</style>
</helmet>
<div style="width: 1400px; height: 10550px; box-sizing: border-box; padding: 48px; position: relative; overflow: hidden; background: #0e0f12;">
<div style="{{bgLayer}}"></div>
<div style="{{wrap}}">
<div style="{{h1}}">{{title}}</div>
<div style="{{sub}}">{{intro}}</div>
<div style="{{sub}}">{{intro2}}</div>
<div style="{{legendSt}}"><sc-for list="{{legend}}" as="lg"><div style="{{chipRow}}"><span style="{{lg.sw}}"></span><span>{{lg.label}}</span></div></sc-for></div>
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
<div style="margin:0 0 44px 0">
<div style="{{sec.st.h2}}">{{sec.title}}</div>
<div style="{{sec.st.note}}">{{sec.note}}</div>
<div style="{{sec.grid}}">
<sc-for list="{{sec.cards}}" as="card" hint-placeholder-count="3">
<div style="{{card.st.card}}">
<div style="{{card.st.head}}"><div style="{{card.st.name}}">{{card.name}}</div><button onClick="{{card.toggle}}" style="{{card.st.btn}}">{{card.btn}}</button></div>
<div style="{{card.st.trig}}">{{card.trigger}}</div>
<div style="{{card.st.trig}}">{{card.desc}}</div>
<div style="{{card.st.meta}}">{{card.meta}}</div>
<div style="{{card.st.box}}"><pre style="{{card.preSt}}"><sc-for list="{{card.live}}" as="ln"><div><sc-for list="{{ln.runs}}" as="run"><span style="{{run.s}}">{{run.t}}</span></sc-for></div></sc-for></pre></div>
<div style="{{card.st.lbl}}">{{card.sheetLbl}}</div>
<div style="{{card.st.strip}}"><sc-for list="{{card.tiles}}" as="tile"><div style="{{tile.st}}"><pre style="{{tile.pre}}"><sc-for list="{{tile.lines}}" as="ln"><div><sc-for list="{{ln.runs}}" as="run"><span style="{{run.s}}">{{run.t}}</span></sc-for></div></sc-for></pre><div style="{{tile.idx}}">{{tile.lbl}}</div></div></sc-for></div>
</div>
</sc-for>
<sc-for list="{{sec.tiles}}" as="tile" hint-placeholder-count="6">
<div style="{{tile.st.tile}}">
<div style="{{tile.st.box}}"><pre style="{{tile.preSt}}"><sc-for list="{{tile.lines}}" as="ln"><div><sc-for list="{{ln.runs}}" as="run"><span style="{{run.s}}">{{run.t}}</span></sc-for></div></sc-for></pre></div>
<div style="{{tile.st.tname}}">{{tile.name}}</div>
<div style="{{tile.st.tcode}}">{{tile.code}}</div>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>

        } else if (c.kind === 'px') {
          const k = self.pxBlock(c.p, c, b.skin, b.body, st, self.frameAt(c, 0), 'p', c.p.livePx, c.p.sheetPx);
          o.rows = k.live; o.tiles = k.tiles; o.sheetLbl = c.p.sheetLbl; o.swatch = 'background:' + b.body + ';width:12px;height:12px;border-radius:3px;display:inline-block';
          pxCards.push(o);
        } else {
          const kt = self.termBlock(c.t, c, b.skin, b.body, st, self.frameAt(c, 0), 't');
          const kp = self.pxBlock(c.p, c, b.skin, b.body, st, self.frameAt(c, 1), 'p', c.p.livePx, c.p.sheetPx);
          o.live = kt.live; o.tTiles = kt.tiles; o.preSt = c.t.livePre; o.tSheetLbl = c.t.sheetLbl; o.tMeta = c.t.meta;
          o.rows = kp.live; o.pTiles = kp.tiles; o.pSheetLbl = c.p.sheetLbl; o.pMeta = c.p.meta;
          duals.push(o);
        }
      });
      (sec.tiles || []).forEach(function (t) {
        const b = self.bodyOf(t);
        const o = { name: t.name, code: t.code || '', st: st };
        if (t.kind === 'term') {
          const cc = fold(self.cache, 'tile:' + t.id, () => ({}));
          o.lines = fold(cc, b.skin, () => toLines(t.frame, b.body)); o.preSt = t.pre;
          tiles.push(o);
        } else {
          const cc = fold(self.cache, 'tile:' + t.id, () => ({}));
          o.rows = fold(cc, b.skin, () => toPx(t.rows, t.px, b.body, DATA.pal));
          pxTiles.push(o);
        }
      });
      return { title: sec.title, note: sec.note, st: st, grid: sec.grid, cards: cards, pxCards: pxCards, duals: duals, tiles: tiles, pxTiles: pxTiles };
    });
    const legend = DATA.legend.map(function (l) { return { label: l.label, sw: st.sw + ';background:' + (l.color === 'B' ? DATA.skins[(p.skin && DATA.skins[p.skin]) ? p.skin : 'classic'] : l.color) }; });
    return { bgLayer: st.bg, wrap: st.wrap, h1: st.h1, sub: st.sub, legendSt: st.legend, chipRow: st.chipRow, title: DATA.title, intro: DATA.intro, intro2: DATA.intro2, legend: legend, sections: sections };
  }
}
